# Builds the package and publishes it to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored in the repository.
# Setup: add a GitHub publisher for this repo in the PyPI project settings
# (workflow: publish.yml, environment: pypi) and create a "pypi" environment in
# the repository settings.

name: Publish to PyPI

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
    - name: Check distributions
      run: twine check dist/*
    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyslyde
    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
